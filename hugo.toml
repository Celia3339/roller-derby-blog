baseURL = "https://celia3339.github.io/roller-derby-blog/"
languageCode = "es"
title = "Mi Blog de DataViz"
theme = "PaperMod"

[params]
  defaultTheme = "light"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

[params.homeInfoParams]
  Title = "Hola 👋"
  Content = "Blog sobre estadística, dataviz y roller derby"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/celia3339"

[menu]
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "Sobre mí"
    url = "/about/"
    weight = 2


[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
