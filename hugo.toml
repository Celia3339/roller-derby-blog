baseURL = "https://celia3339.github.io/roller-derby-blog/"
languageCode = "es"
title = "Mi Blog de DataViz"
theme = "PaperMod"

[params]
  defaultTheme = "light"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true

  [params.logo]
    url = "/logo.png"
    width = 80
    height = 80
    alt = "Roller Derby For The Plot"


[params.label]
  text = " "
  icon = "logo.png"
  iconHeight = 80


[params.homeInfoParams]
  Title = "Roller Derby · For The Plot"
  Content = "Blog sobre estadística, dataviz y roller derby"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/celia3339"


[menu]
  [[menu.main]]
    name = "BLOG"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    name = "DATAVIZ"
    url = "/tags/dataviz/"
    weight = 2
  [[menu.main]]
    name = "SOBRE MÍ"
    url = "/about/"
    weight = 3
  [[menu.main]]
    name = "CONTACTO"
    url = "/contact/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
